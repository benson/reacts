<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="description" content="Very chill animals. Very human reactions. Browse and search the collection.">
  <title>reacts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d5fa67'/%3E%3Ctext x='14' y='49' font-family='Arial' font-weight='900' font-size='52'%3Er%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><a class="wordmark" href="./" aria-label="reacts home">reacts<span>✳</span></a><span class="header-note">a very chill collection</span></header>
  <main>
    <section class="search-section" aria-label="Search reactions">
      <h1>A whole mood.</h1>
      <form role="search"><label class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="Search reactions" placeholder="Search a feeling, animal, or gesture…" autocomplete="off"><kbd>/</kbd></label></form>
      <nav id="filters" aria-label="Browse by mood"></nav>
    </section>
    <div class="collection-heading"><h2 id="heading">All reactions</h2><span id="count" role="status" aria-live="polite"></span></div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" hidden><h2>No matching moods.</h2><button id="reset">Clear search</button></div>
    <noscript>Enable JavaScript to search and browse the collection.</noscript>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <button class="close" aria-label="Close image">×</button>
    <img id="detail-image" alt="">
    <div class="detail-content"><h2 id="detail-title"></h2><div id="tags"></div><div class="actions"><button id="copy">Copy image link</button><a id="download" download>Download</a></div><p id="copy-status" role="status"></p></div>
  </dialog>
</body>
</html>
